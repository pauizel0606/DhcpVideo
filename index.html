<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pau Izquierdo · DHCP</title>

  <style>
    :root {
      --orange: #ff7417;
      --orange-light: #ff9a55;
      --bg: #07080b;
      --text: #f5f5f7;
      --muted: #999ba2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* =====================================================
       FONDO
    ===================================================== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -10;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255, 116, 23, 0.08),
          transparent 45%
        ),
        #07080b;
    }

    /* Oscurece ligeramente los extremos */

    .background::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 30%,
          rgba(0, 0, 0, 0.35) 100%
        );

      pointer-events: none;
    }

    /* =====================================================
       AURORAS NARANJAS
    ===================================================== */

    .aurora {
      position: absolute;

      width: 75vw;
      height: 75vw;

      max-width: 1000px;
      max-height: 1000px;

      border-radius: 50%;

      filter: blur(100px);

      background:
        radial-gradient(
          circle,
          rgba(255, 100, 15, 0.32) 0%,
          rgba(255, 100, 15, 0.17) 28%,
          rgba(255, 100, 15, 0.06) 50%,
          transparent 70%
        );

      pointer-events: none;
    }

    .aurora.one {
      left: -25%;
      top: -35%;

      animation:
        auroraOne 18s ease-in-out infinite;
    }

    .aurora.two {
      right: -30%;
      bottom: -40%;

      width: 85vw;
      height: 85vw;

      animation:
        auroraTwo 22s ease-in-out infinite;
    }

    .aurora.three {
      width: 55vw;
      height: 55vw;

      left: 25%;
      top: 20%;

      opacity: 0.55;

      animation:
        auroraThree 25s ease-in-out infinite;
    }

    @keyframes auroraOne {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      25% {
        transform:
          translate3d(14vw, 7vh, 0)
          scale(1.08);
      }

      50% {
        transform:
          translate3d(24vw, 18vh, 0)
          scale(0.92);
      }

      75% {
        transform:
          translate3d(8vw, 25vh, 0)
          scale(1.05);
      }
    }

    @keyframes auroraTwo {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      25% {
        transform:
          translate3d(-12vw, -7vh, 0)
          scale(1.07);
      }

      50% {
        transform:
          translate3d(-25vw, -15vh, 0)
          scale(0.94);
      }

      75% {
        transform:
          translate3d(-7vw, -22vh, 0)
          scale(1.04);
      }
    }

    @keyframes auroraThree {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      33% {
        transform:
          translate3d(10vw, -8vh, 0)
          scale(1.12);
      }

      66% {
        transform:
          translate3d(-12vw, 10vh, 0)
          scale(0.9);
      }
    }

    /* =====================================================
       MALLA / LÍNEAS SUTILES
    ===================================================== */

    .grid {
      position: absolute;
      inset: -50%;

      opacity: 0.08;

      background-image:
        linear-gradient(
          rgba(255, 122, 24, 0.12) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 122, 24, 0.12) 1px,
          transparent 1px
        );

      background-size: 80px 80px;

      transform: perspective(600px) rotateX(65deg);

      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      from {
        background-position:
          0 0,
          0 0;
      }

      to {
        background-position:
          0 80px,
          80px 0;
      }
    }

    /* =====================================================
       PARTÍCULAS
    ===================================================== */

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: var(--orange-light);

      box-shadow:
        0 0 8px rgba(255, 116, 23, 0.8),
        0 0 20px rgba(255, 116, 23, 0.35);

      opacity: 0;

      animation: particleMove linear infinite;
    }

    .particle:nth-child(1) {
      left: 8%;
      animation-duration: 12s;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      left: 21%;
      animation-duration: 16s;
      animation-delay: -5s;
    }

    .particle:nth-child(3) {
      left: 37%;
      animation-duration: 14s;
      animation-delay: -8s;
    }

    .particle:nth-child(4) {
      left: 55%;
      animation-duration: 18s;
      animation-delay: -3s;
    }

    .particle:nth-child(5) {
      left: 71%;
      animation-duration: 13s;
      animation-delay: -7s;
    }

    .particle:nth-child(6) {
      left: 86%;
      animation-duration: 17s;
      animation-delay: -11s;
    }

    .particle:nth-child(7) {
      left: 46%;
      animation-duration: 20s;
      animation-delay: -14s;
    }

    @keyframes particleMove {

      0% {
        transform:
          translate3d(0, 105vh, 0)
          scale(0.5);

        opacity: 0;
      }

      15% {
        opacity: 0.45;
      }

      50% {
        opacity: 0.2;
      }

      85% {
        opacity: 0.4;
      }

      100% {
        transform:
          translate3d(100px, -10vh, 0)
          scale(1);

        opacity: 0;
      }
    }

    /* =====================================================
       CONTENIDO
    ===================================================== */

    .page {
      width: min(1080px, 92vw);

      text-align: center;

      animation:
        pageAppear 1s ease-out both;
    }

    @keyframes pageAppear {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       TITULO
    ===================================================== */

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 18px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--orange);

      box-shadow:
        0 0 8px rgba(255, 116, 23, 0.8),
        0 0 25px rgba(255, 116, 23, 0.5);

      animation: dotPulse 2.5s ease-in-out infinite;
    }

    @keyframes dotPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.5);
      }
    }

    h1 {
      margin-bottom: 12px;

      font-size: clamp(40px, 6vw, 68px);
      line-height: 1;

      font-weight: 700;

      letter-spacing: -0.05em;
    }

    h1 span {
      color: var(--orange);

      text-shadow:
        0 0 30px rgba(255, 116, 23, 0.2);
    }

    .subtitle {
      margin-bottom: 34px;

      color: var(--muted);

      font-size: 15px;
    }

    /* =====================================================
       VIDEO
    ===================================================== */

    .video-wrap {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      max-height: 66vh;

      padding: 7px;

      border: 1px solid rgba(255, 255, 255, 0.11);

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.018)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 80px rgba(255, 116, 23, 0.07);

      backdrop-filter: blur(20px);
    }

    .video-wrap::before {
      content: "";

      position: absolute;

      inset: -1px;

      border-radius: 22px;

      border: 1px solid transparent;

      background:
        linear-gradient(
          120deg,
          transparent 25%,
          rgba(255, 116, 23, 0.5),
          transparent 55%
        ) border-box;

      mask:
        linear-gradient(#000 0 0) padding-box,
        linear-gradient(#000 0 0);

      mask-composite: exclude;

      opacity: 0.45;

      animation: borderAnimation 6s linear infinite;

      pointer-events: none;
    }

    @keyframes borderAnimation {

      0% {
        transform: translateX(-50%);
        opacity: 0;
      }

      30% {
        opacity: 0.5;
      }

      70% {
        opacity: 0.2;
      }

      100% {
        transform: translateX(50%);
        opacity: 0;
      }
    }

    .video-inner {
      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 16px;

      background: #0d0e11;
    }

    video {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      background: #0d0e11;
    }

    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      margin-top: 18px;

      color: #62646b;

      font-size: 12px;
    }

    .footer b {
      color: #898b92;
      font-weight: 500;
    }

    /* =====================================================
       MÓVIL
    ===================================================== */

    @media (max-width: 600px) {

      .page {
        width: 94vw;
      }

      .video-wrap {
        padding: 5px;
        border-radius: 17px;
      }

      .video-inner {
        border-radius: 12px;
      }

      .subtitle {
        margin-bottom: 24px;
      }

      .grid {
        opacity: 0.04;
      }

      .aurora {
        filter: blur(80px);
      }
    }

    /* =====================================================
       ACCESIBILIDAD
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

  </style>
</head>

<body>

  <!-- =====================================================
       FONDO ANIMADO
  ===================================================== -->

  <div class="background">

    <!-- Auroras -->
    <div class="aurora one"></div>
    <div class="aurora two"></div>
    <div class="aurora three"></div>

    <!-- Malla en movimiento -->
    <div class="grid"></div>

    <!-- Partículas -->
    <div class="particles">

      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>

    </div>

  </div>


  <!-- =====================================================
       CONTENIDO
  ===================================================== -->

  <main class="page">

    <div class="eyebrow">

      <span class="dot"></span>

      Actividad DHCP

    </div>


    <h1>
      Pau <span>Izquierdo</span>
    </h1>


    <p class="subtitle">
      Configuración y demostración del servidor DHCP
    </p>


    <!-- =================================================
         VIDEO
    ================================================= -->

    <section class="video-wrap">

      <div class="video-inner">

        <video
          controls
          preload="metadata"
          playsinline
        >

          <!--
            Pon tu vídeo en la misma carpeta
            que este archivo HTML.

            Nombre:
            video.mp4
          -->

          <source
            src="video.mp4"
            type="video/mp4"
          >

          Tu navegador no puede reproducir este vídeo.

        </video>

      </div>

    </section>


    <div class="footer">

      Sistemas Microinformáticos y Redes ·
      <b>DHCP</b>

    </div>

  </main>

</body>
</html>
