<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pau Izquierdo · DHCP</title>

  <style>
    :root {
      --orange: #ff7a18;
      --text: #f7f7f8;
      --muted: #a7a7ad;
      --bg: #08090b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 122, 24, 0.08),
          transparent 30%
        ),
        var(--bg);
    }

    /* FONDO ANIMADO */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    .orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.13;
      background: var(--orange);
      animation: float 16s ease-in-out infinite;
    }

    .orb.one {
      top: -180px;
      left: -120px;
    }

    .orb.two {
      right: -180px;
      bottom: -160px;
      width: 500px;
      height: 500px;
      animation-delay: -7s;
    }

    .orb.three {
      width: 220px;
      height: 220px;
      top: 45%;
      left: 48%;
      opacity: 0.07;
      animation-duration: 20s;
      animation-delay: -11s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(45px, -30px, 0) scale(1.08);
      }
    }

    /* CONTENIDO */

    .page {
      width: min(1080px, 92vw);
      text-align: center;
      animation: appear 0.8s ease-out both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 16px rgba(255, 122, 24, 0.7);
    }

    h1 {
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 span {
      color: var(--orange);
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 34px;
    }

    /* VIDEO */

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 66vh;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 7px;
      background: rgba(255, 255, 255, 0.035);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 0 60px rgba(255, 122, 24, 0.06);

      backdrop-filter: blur(16px);
    }

    .video-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #111216;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #0d0e11;
    }

    /* PIE */

    .footer {
      margin-top: 18px;
      color: #676970;
      font-size: 12px;
    }

    .footer b {
      color: #909198;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .video-wrap {
        border-radius: 16px;
        padding: 5px;
      }

      .video-inner {
        border-radius: 12px;
      }

      .subtitle {
        margin-bottom: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- Fondo animado -->
  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>

  <main class="page">

    <div class="eyebrow">
      <span class="dot"></span>
      Actividad DHCP
    </div>

    <h1>
      Pau <span>Izquierdo</span>
    </h1>

    <p class="subtitle">
      Configuración y demostración del servidor DHCP
    </p>

    <section class="video-wrap">
      <div class="video-inner">

        <video controls preload="metadata">
          <source src="video.mp4" type="video/mp4">
          Tu navegador no puede reproducir este vídeo.
        </video>

      </div>
    </section>

    <div class="footer">
      Sistemas Microinformáticos y Redes · <b>DHCP</b>
    </div>

  </main>

</body>
</html>
