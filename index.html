<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pau Izquierdo · DHCP</title>

<style>

:root {
    --orange: #ff6a00;
    --orange2: #ff9d45;
    --bg: #050608;
    --white: #f5f5f7;
    --gray: #9699a1;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   FONDO
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #050608;
    z-index: -10;
}


/* =========================================================
   GRANDES FORMAS NARANJAS
========================================================= */

.blob {
    position: absolute;

    width: 650px;
    height: 650px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            rgba(255, 170, 90, 0.95),
            rgba(255, 106, 0, 0.65) 25%,
            rgba(255, 70, 0, 0.25) 55%,
            transparent 72%
        );

    filter: blur(45px);

    mix-blend-mode: screen;

    opacity: 0.7;
}


/* Blob 1 */

.blob:nth-child(1) {

    left: -300px;
    top: -300px;

    animation:
        blob1 12s ease-in-out infinite alternate;
}


/* Blob 2 */

.blob:nth-child(2) {

    right: -300px;
    bottom: -300px;

    animation:
        blob2 15s ease-in-out infinite alternate;

    animation-delay: -5s;
}


/* Blob 3 */

.blob:nth-child(3) {

    width: 500px;
    height: 500px;

    left: 35%;
    top: 30%;

    opacity: 0.35;

    animation:
        blob3 10s ease-in-out infinite alternate;

    animation-delay: -3s;
}


@keyframes blob1 {

    0% {
        transform:
            translate(0, 0)
            scale(0.9);
    }

    50% {
        transform:
            translate(350px, 180px)
            scale(1.25);
    }

    100% {
        transform:
            translate(650px, 350px)
            scale(0.85);
    }
}


@keyframes blob2 {

    0% {
        transform:
            translate(0, 0)
            scale(0.9);
    }

    50% {
        transform:
            translate(-350px, -220px)
            scale(1.3);
    }

    100% {
        transform:
            translate(-600px, -400px)
            scale(0.8);
    }
}


@keyframes blob3 {

    0% {
        transform:
            translate(-200px, 100px)
            scale(0.7);
    }

    50% {
        transform:
            translate(250px, -150px)
            scale(1.2);
    }

    100% {
        transform:
            translate(-150px, 200px)
            scale(0.8);
    }
}


/* =========================================================
   ONDAS
========================================================= */

.wave {

    position: absolute;

    width: 900px;
    height: 900px;

    border-radius: 50%;

    border: 2px solid rgba(255, 106, 0, 0.18);

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%) scale(0.1);

    box-shadow:
        0 0 60px rgba(255, 106, 0, 0.08),
        inset 0 0 60px rgba(255, 106, 0, 0.04);

    animation:
        waveAnimation 8s linear infinite;
}


.wave:nth-child(5) {
    animation-delay: -2s;
}

.wave:nth-child(6) {
    animation-delay: -4s;
}

.wave:nth-child(7) {
    animation-delay: -6s;
}


@keyframes waveAnimation {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0.05);

        opacity: 0;
    }

    10% {
        opacity: 0.6;
    }

    70% {
        opacity: 0.25;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(2.2);

        opacity: 0;
    }
}


/* =========================================================
   LÍNEAS QUE CRUZAN LA PANTALLA
========================================================= */

.light {

    position: absolute;

    width: 700px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 120, 30, 0.9),
            transparent
        );

    filter:
        blur(1px)
        drop-shadow(
            0 0 12px rgba(255, 106, 0, 0.7)
        );

    opacity: 0;

    transform: rotate(-25deg);

    animation:
        lightMove 6s linear infinite;
}


.light:nth-child(8) {
    top: 20%;
    left: -700px;
}


.light:nth-child(9) {
    top: 70%;
    left: -700px;

    animation-delay: -3s;
}


@keyframes lightMove {

    0% {
        transform:
            translateX(0)
            rotate(-25deg);

        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    50% {
        opacity: 0.5;
    }

    90% {
        opacity: 0.8;
    }

    100% {
        transform:
            translateX(220vw)
            rotate(-25deg);

        opacity: 0;
    }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

.particles {
    position: absolute;
    inset: 0;
}


.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #ff9140;

    box-shadow:
        0 0 8px #ff6a00,
        0 0 20px rgba(255, 106, 0, 0.8);

    animation:
        particleAnimation 5s linear infinite;
}


.particle:nth-child(1) {
    left: 5%;
    top: 80%;
    animation-delay: 0s;
}

.particle:nth-child(2) {
    left: 15%;
    top: 50%;
    animation-delay: -2s;
}

.particle:nth-child(3) {
    left: 25%;
    top: 90%;
    animation-delay: -4s;
}

.particle:nth-child(4) {
    left: 38%;
    top: 70%;
    animation-delay: -1s;
}

.particle:nth-child(5) {
    left: 52%;
    top: 85%;
    animation-delay: -3s;
}

.particle:nth-child(6) {
    left: 66%;
    top: 60%;
    animation-delay: -5s;
}

.particle:nth-child(7) {
    left: 78%;
    top: 80%;
    animation-delay: -2.5s;
}

.particle:nth-child(8) {
    left: 90%;
    top: 55%;
    animation-delay: -4.5s;
}


@keyframes particleAnimation {

    0% {
        transform:
            translate(0, 80px)
            scale(0);

        opacity: 0;
    }

    20% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        transform:
            translate(80px, -150px)
            scale(1.2);

        opacity: 0.8;
    }

    100% {
        transform:
            translate(-80px, -400px)
            scale(0);

        opacity: 0;
    }
}


/* =========================================================
   CONTENIDO
========================================================= */

.content {

    position: relative;

    width: min(1050px, 92vw);

    margin: auto;

    top: 50%;

    transform: translateY(-50%);

    text-align: center;

    animation: appear 1s ease-out;
}


@keyframes appear {

    from {
        opacity: 0;
        transform:
            translateY(-45%);
    }

    to {
        opacity: 1;
        transform:
            translateY(-50%);
    }
}


/* =========================================================
   ETIQUETA
========================================================= */

.label {

    display: inline-flex;

    align-items: center;

    gap: 9px;

    margin-bottom: 18px;

    color: var(--gray);

    font-size: 12px;

    font-weight: 600;

    letter-spacing: 0.2em;

    text-transform: uppercase;
}


.status {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--orange);

    box-shadow:
        0 0 8px var(--orange),
        0 0 25px var(--orange);

    animation:
        statusPulse 2s ease-in-out infinite;
}


@keyframes statusPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.6);
    }
}


/* =========================================================
   TITULO
========================================================= */

h1 {

    font-size:
        clamp(42px, 7vw, 72px);

    font-weight: 700;

    letter-spacing: -0.055em;

    line-height: 1;

    margin-bottom: 14px;
}


h1 span {

    color: var(--orange);

    text-shadow:
        0 0 40px rgba(255, 106, 0, 0.35);
}


.subtitle {

    color: var(--gray);

    font-size: 15px;

    margin-bottom: 35px;
}


/* =========================================================
   VIDEO
========================================================= */

.video-container {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    border-radius: 22px;

    padding: 7px;

    background:
        rgba(255, 255, 255, 0.045);

    border:
        1px solid rgba(255, 255, 255, 0.13);

    box-shadow:

        0 30px 100px
        rgba(0, 0, 0, 0.6),

        0 0 80px
        rgba(255, 106, 0, 0.12);

    backdrop-filter:
        blur(15px);
}


.video {

    width: 100%;
    height: 100%;

    border-radius: 16px;

    background:
        rgba(5, 6, 8, 0.8);

    overflow: hidden;
}


.video iframe {

    width: 100%;
    height: 100%;

    display: block;

    border: 0;

    border-radius: 16px;
}


/* =========================================================
   PIE
========================================================= */

.footer {

    margin-top: 18px;

    color: #686a72;

    font-size: 12px;
}


.footer strong {

    color: #92949c;

    font-weight: 500;
}


/* =========================================================
   MÓVIL
========================================================= */

@media (max-width: 600px) {

    .content {
        width: 94vw;
    }

    .video-container {
        border-radius: 17px;
        padding: 5px;
    }

    .video {
        border-radius: 12px;
    }

    .video iframe {
        border-radius: 12px;
    }

    .blob {
        filter: blur(35px);
    }

    .wave {
        width: 600px;
        height: 600px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     FONDO ANIMADO
===================================================== -->

<div class="background">

    <!-- Grandes luces -->
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>


    <!-- Ondas -->
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>


    <!-- Líneas de luz -->
    <div class="light"></div>
    <div class="light"></div>


    <!-- Partículas -->
    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>

</div>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<main class="content">


    <div class="label">

        <span class="status"></span>

        ACTIVIDAD DHCP

    </div>


    <h1>
        Pau <span>Izquierdo</span>
    </h1>


    <p class="subtitle">
        Configuración y demostración del servidor DHCP
    </p>


    <!-- =================================================
         VIDEO
    ================================================= -->

    <div class="video-container">

        <div class="video">

            <iframe
                src="https://drive.google.com/file/d/1jRS_pz6NERjY46kkohWA82rylkPoHAeW/view?usp=sharing"
                allow="autoplay"
                allowfullscreen>
            </iframe>

        </div>

    </div>


    <div class="footer">

        Sistemas Microinformáticos y Redes ·
        <strong>DHCP</strong>

    </div>


</main>


</body>
</html>
