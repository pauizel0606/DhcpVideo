<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pau Izquierdo · DHCP</title>

<style>
:root{
    --orange:#ff6a00;
    --orange2:#ff8c2a;
    --dark:#050608;
    --dark2:#0b0d10;
    --text:#f5f5f5;
    --muted:#a7a7a7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,106,0,.12), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,106,0,.08), transparent 30%),
        var(--dark);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

/* =========================
   FONDO ANIMADO
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:#050608;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    animation:float 12s ease-in-out infinite alternate;
}

.blob.one{
    width:400px;
    height:400px;
    background:#ff6a00;
    top:-120px;
    left:-100px;
}

.blob.two{
    width:350px;
    height:350px;
    background:#ff4500;
    right:-100px;
    bottom:-100px;
    animation-delay:2s;
}

.blob.three{
    width:250px;
    height:250px;
    background:#ff8c2a;
    top:45%;
    left:45%;
    opacity:.12;
    animation-delay:4s;
}

@keyframes float{
    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(60px,-40px) scale(1.15);
    }

    100%{
        transform:translate(-40px,60px) scale(.95);
    }
}

/* Líneas de luz */

.light-line{
    position:absolute;
    width:120%;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,106,0,.4),
        transparent
    );
    transform:rotate(-18deg);
    animation:moveLine 9s linear infinite;
}

.light-line.one{
    top:25%;
    left:-10%;
}

.light-line.two{
    top:65%;
    left:-10%;
    animation-delay:3s;
}

.light-line.three{
    top:85%;
    left:-10%;
    animation-delay:6s;
}

@keyframes moveLine{
    0%{
        transform:translateX(-30%) rotate(-18deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        transform:translateX(30%) rotate(-18deg);
        opacity:0;
    }
}

/* Ondas */

.wave{
    position:absolute;
    width:900px;
    height:900px;
    border:1px solid rgba(255,106,0,.08);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation:pulse 8s ease-in-out infinite;
}

.wave:nth-child(2){
    animation-delay:2s;
}

.wave:nth-child(3){
    animation-delay:4s;
}

@keyframes pulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.7);
        opacity:.15;
    }

    50%{
        transform:translate(-50%,-50%) scale(1.2);
        opacity:.45;
    }
}

/* Partículas */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ff6a00;
    opacity:.45;
    animation:particleMove linear infinite;
}

@keyframes particleMove{
    from{
        transform:translateY(110vh);
        opacity:0;
    }

    15%{
        opacity:.5;
    }

    85%{
        opacity:.5;
    }

    to{
        transform:translateY(-20vh);
        opacity:0;
    }
}

/* =========================
   CONTENIDO
========================= */

.container{
    width:min(1100px, 92%);
    margin:auto;
    padding:70px 0 35px;
}

/* Header */

header{
    text-align:center;
    margin-bottom:50px;
    animation:fadeDown 1s ease forwards;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border:1px solid rgba(255,106,0,.4);
    border-radius:999px;
    color:#ff8c2a;
    background:rgba(255,106,0,.06);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:18px;
}

h1{
    font-size:clamp(45px, 9vw, 95px);
    line-height:.95;
    font-weight:800;
    letter-spacing:-4px;
    background:linear-gradient(
        90deg,
        #fff,
        #ff8c2a,
        #ff6a00
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin-top:20px;
    font-size:clamp(16px, 2vw, 21px);
    color:#bcbcbc;
    line-height:1.5;
}

/* Tarjeta */

.card{
    position:relative;
    background:rgba(10,11,14,.75);
    border:1px solid rgba(255,106,0,.18);
    border-radius:25px;
    padding:25px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        inset 0 0 40px rgba(255,106,0,.02);
    overflow:hidden;
    animation:fadeUp 1s ease .2s both;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,106,0,.05),
            transparent
        );
    pointer-events:none;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Cabecera de la tarjeta */

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
}

.card-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ff6a00;
    box-shadow:
        0 0 10px #ff6a00,
        0 0 25px rgba(255,106,0,.6);
    animation:blink 2s ease-in-out infinite;
}

@keyframes blink{
    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.45;
    }
}

.card-title h2{
    font-size:18px;
}

.status{
    color:#777;
    font-size:13px;
}

/* =========================
   VIDEO
========================= */

.video-container{
    width:100%;
    aspect-ratio:16/9;
    border-radius:18px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255,106,0,.18);
    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 30px rgba(255,106,0,.05);
}

.video{
    width:100%;
    height:100%;
    position:relative;
    background:#000;
}

.video iframe{
    width:100%;
    height:100%;
    display:block;
    border:0;
    border-radius:18px;
}

/* =========================
   INFORMACIÓN
========================= */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:22px;
}

.info-box{
    padding:18px;
    border-radius:15px;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
    transition:.3s ease;
}

.info-box:hover{
    transform:translateY(-4px);
    border-color:rgba(255,106,0,.3);
    background:rgba(255,106,0,.04);
}

.info-box span{
    display:block;
    color:#777;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:7px;
}

.info-box strong{
    font-size:15px;
    color:#eee;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    margin-top:35px;
    color:#666;
    font-size:13px;
    animation:fadeUp 1s ease .5s both;
}

footer strong{
    color:#ff6a00;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .container{
        padding-top:40px;
    }

    header{
        margin-bottom:30px;
    }

    h1{
        letter-spacing:-2px;
    }

    .card{
        padding:15px;
        border-radius:20px;
    }

    .card-header{
        align-items:flex-start;
    }

    .status{
        display:none;
    }

    .info{
        grid-template-columns:1fr;
    }

    .video-container{
        border-radius:13px;
    }

    .video iframe{
        border-radius:13px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>

<!-- =========================
     FONDO
========================= -->

<div class="background">

    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>

    <div class="light-line one"></div>
    <div class="light-line two"></div>
    <div class="light-line three"></div>

    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

    <div class="particles">

        <div class="particle" style="left:5%; animation-duration:12s; animation-delay:1s;"></div>
        <div class="particle" style="left:12%; animation-duration:16s; animation-delay:3s;"></div>
        <div class="particle" style="left:20%; animation-duration:13s; animation-delay:5s;"></div>
        <div class="particle" style="left:28%; animation-duration:18s; animation-delay:2s;"></div>
        <div class="particle" style="left:35%; animation-duration:14s; animation-delay:7s;"></div>
        <div class="particle" style="left:43%; animation-duration:17s; animation-delay:4s;"></div>
        <div class="particle" style="left:50%; animation-duration:15s; animation-delay:1s;"></div>
        <div class="particle" style="left:57%; animation-duration:19s; animation-delay:6s;"></div>
        <div class="particle" style="left:65%; animation-duration:13s; animation-delay:3s;"></div>
        <div class="particle" style="left:72%; animation-duration:16s; animation-delay:8s;"></div>
        <div class="particle" style="left:80%; animation-duration:14s; animation-delay:2s;"></div>
        <div class="particle" style="left:88%; animation-duration:18s; animation-delay:5s;"></div>
        <div class="particle" style="left:95%; animation-duration:15s; animation-delay:9s;"></div>

    </div>

</div>

<!-- =========================
     CONTENIDO
========================= -->

<main class="container">

    <header>

        <div class="badge">
            Sistemas Microinformáticos y Redes
        </div>

        <h1>Pau Izquierdo</h1>

        <p class="subtitle">
            Configuración y demostración del servidor DHCP
        </p>

    </header>


    <section class="card">

        <div class="card-header">

            <div class="card-title">

                <div class="dot"></div>

                <h2>
                    Presentación DHCP
                </h2>

            </div>

            <div class="status">
                VIDEO · DRIVE
            </div>

        </div>


        <!-- =========================
             VIDEO DE GOOGLE DRIVE
        ========================= -->

        <div class="video-container">

            <div class="video">

                <iframe
                    src="https://docs.google.com/videos/d/122y8naQxG0eU_17R1av7qEDRlvLOqhANOJsDba1prSc/play?usp=sharing"
                    allow="autoplay"
                    allowfullscreen>
                </iframe>

            </div>

        </div>


        <!-- =========================
             INFORMACIÓN
        ========================= -->

        <div class="info">

            <div class="info-box">

                <span>
                    Alumno
                </span>

                <strong>
                    Pau Izquierdo
                </strong>

            </div>


            <div class="info-box">

                <span>
                    Módulo
                </span>

                <strong>
                    Sistemas Microinformáticos y Redes
                </strong>

            </div>


            <div class="info-box">

                <span>
                    Tema
                </span>

                <strong>
                    Servidor DHCP
                </strong>

            </div>

        </div>

    </section>


    <footer>

        Sistemas Microinformáticos y Redes ·
        <strong>DHCP</strong>

    </footer>

</main>


<script>

/* =========================
   GENERAR MÁS PARTÍCULAS
========================= */

const particles = document.querySelector(".particles");

for(let i = 0; i < 35; i++){

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";

    particle.style.animationDuration =
        (10 + Math.random() * 15) + "s";

    particle.style.animationDelay =
        (-Math.random() * 15) + "s";

    particle.style.width =
        (1 + Math.random() * 3) + "px";

    particle.style.height =
        particle.style.width;

    particle.style.opacity =
        (.15 + Math.random() * .45);

    particles.appendChild(particle);
}

</script>

</body>
</html>
